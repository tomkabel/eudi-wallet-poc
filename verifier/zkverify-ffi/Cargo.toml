[package]
name = "zkverify-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI over the Longfellow Rust runtime, so a Go service can verify mdoc ZK proofs without a C++ toolchain"

[lib]
name = "zkverify"
crate-type = ["staticlib", "rlib"]

[dependencies]
mdoc-zk-runtime = { path = "../../../longfellow-zk/rust/applications/mdoc_zk/runtime" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Arithmetic overflow must panic (caught by catch_unwind) rather than wrap into
# a huge allocation that aborts the verifier process.
overflow-checks = true
