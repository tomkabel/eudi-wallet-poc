<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Present a zero-knowledge age proof</title>
<style>
  /* Same visual register as the existing verifier pages: system font, one
     column, no images, honest status text. */
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  button { font: inherit; padding: 0.6rem 1.2rem; }
  #status { margin-top: 1.5rem; line-height: 1.5; }
  .ok { color: #0a6b2d; } .bad { color: #a11212; }
  code { background: #f4f4f4; padding: 0.1rem 0.3rem; }
</style>
</head>
<body>
<h1>Present a zero-knowledge age proof</h1>
<p>This page asks your browser's digital credentials API for an
ISO&nbsp;18013-7 Annex&nbsp;C presentation of <code>{{.Element}}</code>. Nothing
about you except the predicate leaves your device: the verifier learns that
the answer is <code>true</code>, and nothing else.</p>
<button id="share">Present</button>
<div id="status"></div>
<script>
const SESSION_ID = {{.ID}};
const status = document.getElementById('status');
function say(text, cls) {
  status.textContent = text;
  status.className = cls || '';
}

document.getElementById('share').addEventListener('click', async () => {
  try {
    say('Fetching the presentation request…');
    const res = await fetch('/present/dcapi/request/' + SESSION_ID);
    if (!res.ok) throw new Error('request fetch failed: ' + res.status);
    const data = await res.json();

    say('Asking your wallet…');
    // W3C Digital Credentials: DigitalCredentialRequestOptions.requests (the
    // older `providers` member is gone), and DigitalCredential.data is an
    // object, not bytes; for org-iso-mdoc it carries the base64url response.
    const credential = await navigator.credentials.get({
      digital: {
        requests: [{
          protocol: 'org-iso-mdoc',
          data: {
            deviceRequest: data.device_request,
            encryptionInfo: data.encryption_info,
          },
        }],
      },
    });
    if (!credential || !credential.data || !credential.data.response) throw new Error('the wallet returned nothing');

    say('Submitting the encrypted response…');
    const post = await fetch('/present/dcapi/response/' + SESSION_ID, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ response: credential.data.response }),
    });
    const answer = await post.json();
    say(answer.valid ? 'Verified: the proof holds.' : ('Not verified: ' + (answer.detail || 'no reason given')),
        answer.valid ? 'ok' : 'bad');
  } catch (err) {
    say('Failed: ' + (err.message || err), 'bad');
  }
});
</script>
</body>
</html>
