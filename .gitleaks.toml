# Secret scanning (PKI plan NEW-P0-2, hardening Phase 1). Default rules plus allowlists where
# every entry names its file or commit and why it is not a secret. No allowlist may name a
# path that holds a private key at HEAD: tests/check_pki_gates.py and tools/publish_guard.py
# enforce that. A new allowlist entry needs the same review as a new key.

[extend]
useDefault = true

# History only. This key was tracked until the commit that removed it; the history scan
# (`gitleaks git`) still sees it in older commits. tests/check_pki_gates.py fails if this
# path matches a tracked file, so the entry can never excuse a key at HEAD.
[[allowlists]]
description = "History-only key material (removed from HEAD)"
paths = [
  # Holder device key of the step 0 Rust-prover fixture. Declared test material in that
  # directory's old README; bound no real credential. No decision to purge history (D1, 2026-11-04).
  '''^verifier/go/zk/testdata/step0-rust-prover/device_key\.pem$''',
]

[[allowlists]]
description = "Example tokens in specification text and wire-capture test vectors"
paths = [
  # Spec text: sample access tokens and nonces in the profile's worked examples.
  '''^docs/profiles/av/annex-a-examples\.md$''',
  # Wire captures of the AV profile's token and credential responses (sample tokens, no live issuer).
  '''^tests/vectors/av-profile/external/11-token-response\.http$''',
  '''^tests/vectors/av-profile/external/13-credential-response\.http$''',
  # JWE test vectors: RFC 3394 / RFC 7520 published key material, public by definition.
  '''^verifier/go/internal/jose/jwe_test\.go$''',
  # Generator note carrying a public-key thumbprint, not a secret.
  '''^verifier/go/zk/testdata/step6-device-pubkey/GENERATED-BY$''',
  # Token Status List JWTs: public by design (draft-ietf-oauth-status-list).
  '''^statuslists/[12]$''',
]

[[allowlists]]
description = "BMAD story identifiers, not credentials"
regexTarget = "match"
regexes = ['''story_key"?:\s*"?[0-9]+-[0-9]+-''', '''key-screens\.md''']

[[allowlists]]
# Upstream open-eid release commits carried a Firebase client API key in
# app/google-services.json. It is upstream's key, public in upstream's history, and
# was removed from this fork at 7d171e2. Rotation is upstream's call (RIA); a history
# purge is decision D5 in docs/planning/PKI-REMEDIATION-PLAN.md.
description = "Upstream Firebase key in pre-fork history"
commits = [
  "0866e946874f666caa40e85acf8fc8fb22d71fc0",
  "5952d0c8e92e9bb618dc3fdd9ac193cba8749ad3",
  "859df451144f9921421afbd885a3c9e56b4a349a",
  "95a056656992c1402b9b928d8baabe1fcfaecf42",
  "cb33a7d21dd6ac4cb6bbd56dd74ba49b0e77e8cc",
]
