name: App

# The Android app's unit tests. Kept apart from ci.yml so app pushes don't pay
# for the ZK spine's Rust build, and ZK pushes don't pay for Gradle.
on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/app.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (local_mocks)
        # settings.gradle.kts reads these for the signerry and aarmam GitHub
        # Packages registries; the key needs read:packages. Fork PRs get no
        # secrets, so this job fails there with a 401.
        env:
          GPR_USER: ${{ github.repository_owner }}
          GPR_API_KEY: ${{ secrets.GPR_API_KEY }}
        run: ./gradlew :app:testLocal_mocksUnitTest
