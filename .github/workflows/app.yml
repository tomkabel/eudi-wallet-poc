name: App

# The Android app's unit and invocation surface tests. Kept apart from ci.yml so app pushes don't pay
# for the ZK spine's Rust build, and ZK pushes don't pay for Gradle.
on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'zk-conformance/**'
      - 'tests/test_av_vci_android.py'
      - 'tests/vectors/trust/**'
      - 'verifier/go/internal/algpolicy/policy/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'zk-conformance/**'
      - 'tests/test_av_vci_android.py'
      - 'tests/vectors/trust/**'
      - 'verifier/go/internal/algpolicy/policy/**'
      - '.github/workflows/app.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # ZK conformance rides with the app workflow (devsecops C6-rider): the
      # fixtures it must stay byte-identical to are pinned from THIS module, so
      # an app-side change that shifts the minted transcript fails the suite
      # in the same PR instead of surfacing later in the verifier build.
      - name: ZK conformance (byte-identical fixtures)
        run: ./gradlew :zk-conformance:test
      - name: Unit tests (local_mocks)
        # Includes SharedTrustVectorsTest: the differential half of the Go
        # verifier's TestSharedTrustVectors (PKI plan NEW-S2-4).
        run: ./gradlew :app:testLocal_mocksUnitTest
      - name: Lint security gate (release; new findings only)
        # PKI plan NEW-S1-1: security checks are fatal; app/lint-baseline.xml
        # freezes what was in the tree when the gate landed.
        run: ./gradlew :app:lintRelease
      - name: No mock class in the release build (PKI plan NEW-S1-4)
        run: |
          ./gradlew :app:compileReleaseKotlin :app:compileReleaseJavaWithJavac
          test -d app/build/tmp/kotlin-classes/release
          if find app/build/tmp/kotlin-classes/release app/build/intermediates/javac/release \
               \( -name '*Mock.class' -o -name '*Mock$*.class' \) 2>/dev/null | grep .; then
            echo "::error::mock classes compiled into release"; exit 1
          fi

  invocation-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Prepare Android 35 runtime
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --name invocation --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd invocation -no-window -no-audio -no-snapshot -gpu swiftshader > "$RUNNER_TEMP/invocation-emulator.log" 2>&1 &
          adb wait-for-device
          for _ in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/invocation-emulator.log"
          exit 1
      - name: Install local_mocks
        run: ./gradlew :app:installLocal_mocks
      - name: AV invocation Android surface (English and Estonian)
        run: python3 -u tests/test_av_vci_android.py
      - name: Stop runtime
        if: always()
        run: adb emu kill || true
