name: Maven mirror

# Publishes the signerry/aarmam fork artifacts (com.signerry.dss-android:1.02.08,
# com.signerry:androidawt:1.0.4, com.signerry.santuario:xmlsec:2.3.4 and the
# org.glassfish.jaxb / com.sun.xml.bind 3.1.6 rebuilds) plus their stock JAXB
# 2.3.2 parents to a plain Maven-layout directory on gh-pages under maven/.
#
# Why: settings.gradle.kts resolves these from GitHub Packages, which demands
# authentication even for public artifacts (401 without a token), so fork PRs
# could not build the app. The static HTTPS mirror needs no credentials at all.
#
# The app's Gradle build points at
#   https://tomkabel.github.io/eudi-wallet-poc/maven
# and .github/maven-mirror/manifest.json pins every file's sha256; fetch.py
# verifies bytes and fails the run rather than publishing an unverified mirror.
#
# Seeding: the mirror was seeded once from .github/maven-mirror/site/ (committed),
# so Gradle resolves even before this workflow ever runs. Keep this workflow on
# a schedule so the mirror survives upstream republishing; run it manually
# (workflow_dispatch) right after bumping the pinned versions in manifest.json.
#
# NOTE: needs GitHub Pages enabled for the repository with the gh-pages branch
# as source (Settings -> Pages, or POST /repos/{owner}/{repo}/pages once).

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1' # weekly, Mondays 04:23 UTC

permissions:
  contents: read

concurrency:
  group: maven-mirror
  cancel-in-progress: false

jobs:
  # fetch.py runs with a read-only token; only the publish job, which runs no
  # repository code, can write to gh-pages.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Fetch and verify every artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/maven-mirror/fetch.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-mirror-site
          path: .github/maven-mirror/site
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh-pages publication
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: maven-mirror-site
          path: site

      - name: Publish to gh-pages under maven/
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: site
          keep_files: false
          commit_message: 'Publish Maven mirror from ${{ github.sha }}'
