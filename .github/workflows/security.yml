name: Security

# PKI plan P0/P1 gates (docs/planning/PKI-REMEDIATION-PLAN.md). Runs on every push,
# with no path filter: a secret or a trust-material change can land anywhere.
on:
  push:
  pull_request:
  schedule:
    # Weekly, so new advisories and approaching certificate expiry surface
    # without waiting for a push.
    - cron: '41 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: false
      - name: install gitleaks
        # v8.30.1, pinned by commit (a tag can move); .pre-commit-config.yaml pins the same commit.
        run: go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e
      - name: the gate turns red on a seeded key
        # Proves the scanner and config still catch a PRIVATE KEY block before
        # trusting their silence on the real tree. The key is generated here and
        # never touches the repository.
        run: |
          seed="$RUNNER_TEMP/seed"; mkdir -p "$seed"
          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt > "$seed/leak.pem"
          if "$(go env GOPATH)/bin/gitleaks" dir --no-banner --config .gitleaks.toml "$seed"; then
            echo "::error::gitleaks did not flag a seeded private key"; exit 1
          fi
      - name: gitleaks over every commit
        run: '"$(go env GOPATH)"/bin/gitleaks git --no-banner --redact --config .gitleaks.toml .'

  publish-guard:
    name: publish guard (no tracked private key, keystore or demo-data)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 tools/publish_guard.py
      - name: the guard turns red on a planted key
        run: python3 -m unittest discover -s tests -p 'test_publish_guard.py'

  pki-gates:
    name: PKI gates (trust-all, mocks, freshness flag, trust manifest, key material)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      - name: Python deps (uv.lock; every wheel hash verified)
        run: |
          uv sync --locked --only-group ci
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: gates
        run: python3 tests/check_pki_gates.py
      - name: each gate turns red on its seeded defect
        run: python3 -m unittest discover -s tests -p 'test_pki_gates.py'
      - name: dependency advisories (Python)
        run: |
          pip install pip-audit==2.10.1
          uv export --only-group ci --no-emit-project --no-header --quiet > "$RUNNER_TEMP/locked.txt"
          pip-audit --strict -r "$RUNNER_TEMP/locked.txt"

  pin-gate:
    name: pin gate (every `uses` by SHA, every FROM by digest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 tools/pin_gate.py
      - name: the gate turns red on an unpinned reference
        run: python3 -m unittest discover -s tests -p 'test_pin_gate.py'

  zizmor:
    name: zizmor (workflow static analysis, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Text output and a failing exit code, not SARIF upload: the fork has no GitHub
          # Advanced Security requirement and this job must block the PR.
          advanced-security: false
          version: 1.32.0
          inputs: .github/

  go:
    name: govulncheck and gosec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: verifier/go/go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
      - name: govulncheck (any reachable advisory fails)
        working-directory: verifier/go
        # Source mode type-checks the cgo package without linking libzkverify.a.
        run: '"$(go env GOPATH)"/bin/govulncheck ./...'
      - name: gosec (fail on findings outside the baseline)
        working-directory: verifier/go
        run: |
          "$(go env GOPATH)/bin/gosec" -quiet -fmt=json -out="$RUNNER_TEMP/gosec.json" ./... || true
          python3 ../../tests/check_pki_gates.py --gosec "$RUNNER_TEMP/gosec.json"
