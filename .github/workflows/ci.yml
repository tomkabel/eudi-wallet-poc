name: CI

# The ZK spine (Go, Rust, Python). The Android app is built by app.yml.
#
# Every push and pull request starts this workflow; the `changes` job (dorny/paths-filter) decides
# which jobs run. Path filters on `on:` would leave a required check "Expected, waiting" forever
# when they skip the whole workflow, so the filtering is per job and `ci-ok` is the one check to
# require in branch protection: it passes when every job it needs succeeded or was skipped.
on:
  push:
  pull_request:

# A PR from a branch in this repo triggers both `push` and `pull_request`. Keying
# on head_ref for PRs puts both in the same group so the newer one cancels the
# older, instead of paying twice for the same commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least-privilege default (devsecops F1): the workflow reads the repo and runs
# tests; no job needs write scopes. Individual checkouts drop the embedded
# credentials too (persist-credentials: false) — GITHUB_TOKEN stays available
# as an env var for the gradle/actions caches.
permissions:
  contents: read

defaults:
  run:
    # zkverify-ffi path-depends on ../../../longfellow-zk, so the two trees must
    # be siblings. Checking out into a subdirectory makes the sibling live inside
    # the workspace, which keeps every cache path relative and ordinary.
    working-directory: eudi-wallet-poc

jobs:
  changes:
    name: changes (which paths moved)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # the filter lists a PR's files through the API
    outputs:
      go_rust: ${{ steps.filter.outputs.go_rust }}
      python: ${{ steps.filter.outputs.python }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go_rust: &go_rust
              - 'verifier/**'
              - 'zk-age-poc/**'
              - 'scripts/**'
              - 'Makefile'
              - 'mise.toml'
              - '.gitattributes'
              - '.github/workflows/ci.yml'
            python: &python
              - 'issuer/**'
              - 'wallet/**'
              - 'tests/**'
              - 'sandbox/**'
              - 'tools/**'
              - 'demo/**'
              - 'docs/profiles/av/**'
              - 'docs/profiles/AV-PROFILE-CLAUSE-REGISTRY.md'
              - 'docs/profiles/AV-PROFILE-FIXTURES.md'
              - 'docs/profiles/AV-REPORT-REPRODUCTION.md'
              - 'docs/profiles/CARRIER-CONFORMANCE-RUNNER.md'
              - 'docs/README.md'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            # The prover/verifier build, plus the Python that drives it end to end.
            e2e:
              - *go_rust
              - 'issuer/**'
              - 'wallet/**'
              - 'tests/run_carrier_conformance.py'
              - 'tests/e2e.sh'
              - 'tests/requirements-ci.txt'

  fast:
    name: fast (lint, vet, unit tests)
    needs: changes
    if: needs.changes.outputs.go_rust == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: eudi-wallet-poc
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: eudi-wallet-poc/verifier/go/go.mod
          # The module has no third-party dependencies and therefore no go.sum,
          # which the built-in cache needs to key on.
          cache: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: gofmt
        working-directory: eudi-wallet-poc/verifier/go
        run: |
          unformatted="$(gofmt -l .)"
          # gofmt -l exits 0 whether or not it listed anything, so the output is
          # the signal.
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: eudi-wallet-poc/verifier/go
        # vet type-checks the cgo package without linking it, so this covers
        # every package with no Rust toolchain in sight.
        run: go vet ./...

      - name: go test (packages that do not link the Rust staticlib)
        working-directory: eudi-wallet-poc/verifier/go
        # Package zk links libzkverify.a through cgo, and package main imports
        # zk, so neither test binary can be linked without a Rust build. The
        # e2e job runs those two once the staticlib exists; this job stays cheap.
        # -race (codesec F8-race): these tests assert concurrency behaviour
        # (session store sweeps, reads-limiter bounds), which only the race
        # detector exercises — CGO is on by default when the detector is on.
        run: go test -race ./oid4vp/... ./internal/... ./circuits/...

      - name: python compiles
        run: python3 -m compileall -q issuer verifier wallet tests sandbox

      - name: AV profile registry (offline traceability and mutation controls)
        run: |
          python3 tests/check_av_registry.py
          python3 -m unittest discover -s tests -p 'test_av_registry.py'

      - name: AV profile fixtures (read-only bytes, provenance and corruption controls)
        run: |
          python3 tools/build_av_fixtures.py --check
          python3 -m unittest discover -s tests -p 'test_av_fixtures.py'

      - name: AV conformance runner regressions
        run: python3 -m unittest discover -s tests -p 'test_av_conformance.py'

      - name: Carrier runner regressions
        run: python3 -m unittest discover -s tests -p 'test_carrier_conformance.py'

      - name: ruff
        # F (pyflakes) and E9 catch undefined names, unused imports and syntax
        # errors — the things that are wrong rather than merely unfashionable.
        # The wider default set flags this codebase's deliberate compact style
        # (`if not x: return`, grouped imports) and enforcing it would mean
        # reformatting working code to satisfy a linter added after the fact.
        #
        # The submodule is a separate project with its own lint setup, and a
        # developer tree has it checked out even where CI leaves it empty.
        # Keep our linter out of them, or `ruff check .` flags their code.
        # The same goes for vendored agent tooling (_bmad, .agents, .claude),
        # which CI never checks out untracked but a developer tree carries.
        run: |
          pip install ruff==0.16.6
          ruff check --isolated --select F,E9 --exclude eudi-arf,_bmad,.agents,.claude .

      - name: the wallet's half of the transcript pin
        # The Go half of these golden vectors runs in the step above; this is the
        # other half, and until now nothing ran it. The two implementations derive
        # the SessionTranscript independently, and a one-byte disagreement fails
        # every proof with an error that says nothing about why — so the agreement
        # is pinned from both sides or it is not pinned at all.
        #
        # It loads wallet/present.py, which imports cbor2 and cryptography: the
        # runner has neither, and without this install the step fails on the
        # import rather than on the vectors.
        run: |
          pip install -r tests/requirements-ci.txt
          python3 wallet/test_transcript.py

      - name: the mint's device public key path
        # Nothing else runs --device-public-key: the Go tests read static
        # fixture bytes and no demo or e2e script passes the flag. cbor2 and
        # cryptography are installed by the step above.
        run: python3 issuer/test_mint_device_key.py

      - name: the mint's IACA chain and key custody
        # PKI plan NEW-S2-1 and NEW-S4-2: the DSC chains to the IACA in
        # issuers.json; persisted keys are encrypted outside --test-mode.
        run: python3 issuer/test_mint_custody.py

      - name: the doctor fails when the toolchain or prover is missing
        run: python3 -m unittest discover -s tests -p 'test_doctor.py'

      - name: the sandbox's age reckoning
        # EE-POA-027: Europe/Tallinn, and 28 February for a 29 February birthday.
        run: python3 sandbox/test_age.py

      - name: shellcheck
        # Info-level findings are style opinions and their codes drift between
        # shellcheck releases (SC2317 became SC2329), so gating on them would
        # make the job fail when the runner image updates rather than when the
        # scripts change. The remaining info notes here are false positives:
        # cleanup() looks unreachable because `trap` invokes it.
        run: shellcheck --severity=warning scripts/*.sh tests/*.sh tools/*.sh demo/*.sh

  e2e:
    name: carrier conformance (prover + verifier)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EE_BENCH_SKIP: "1"   # the percentile run is a host measurement, not a check; STEP8-RECORD
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: eudi-wallet-poc
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: eudi-wallet-poc/verifier/go/go.mod
          cache: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: clone longfellow-zk at the pinned revision
        id: longfellow
        # The revision lives in verifier/zkverify-ffi/longfellow-rev.txt — a path
        # dependency has no lockfile entry, so that committed file is the single
        # source of truth. The script is the same one a developer runs (make deps);
        # it resolves the sibling from its own path, so the default cwd is fine.
        run: |
          ./scripts/bootstrap-longfellow.sh
          echo "rev=$(tr -d '[:space:]' < verifier/zkverify-ffi/longfellow-rev.txt)" >> "$GITHUB_OUTPUT"

      - name: cache cargo registry and build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            longfellow-zk/rust/target
            eudi-wallet-poc/verifier/zkverify-ffi/target
          # The pinned longfellow revision (read from the file in this step) plus
          # the lockfile, the manifests and the copied-in example sources are what
          # decide what gets built.
          key: e2e-${{ runner.os }}-lf${{ steps.longfellow.outputs.rev }}-${{ hashFiles('eudi-wallet-poc/verifier/zkverify-ffi/Cargo.lock', 'eudi-wallet-poc/verifier/zkverify-ffi/Cargo.toml', 'eudi-wallet-poc/verifier/zkverify-ffi/.cargo/config.toml', 'eudi-wallet-poc/zk-age-poc/*.rs', 'eudi-wallet-poc/zk-age-poc/prover.Cargo.lock') }}
          restore-keys: |
            e2e-${{ runner.os }}-lf${{ steps.longfellow.outputs.rev }}-

      - name: build the prover
        env:
          # longfellow-zk's own rust/.cargo/config.toml sets target-cpu=native,
          # which has produced SIGILL binaries on virtualised hosts. Same pin as
          # `make deps` — scripts/prover-examples-install.sh is what it runs.
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          ./scripts/prover-examples-install.sh
          cargo build --locked --release --examples --features testonly \
            --manifest-path ../longfellow-zk/rust/applications/mdoc_zk/runtime/Cargo.toml

      - name: the prover binary exists
        # The build above can succeed without producing this. Say so out loud.
        run: test -x ../longfellow-zk/rust/target/release/examples/ee_poa_demo

      - name: build the verifier
        env:
          # Same pin as the prover examples; zkverify-ffi's .cargo/config.toml
          # pins its own, and the go build records the linked revision.
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          # cd rather than --manifest-path: cargo discovers .cargo/config.toml
          # from the working directory, and zkverify-ffi's is what pins its
          # target-cpu.
          (cd verifier/zkverify-ffi && cargo build --release)
          cd verifier/go && go build -o ../zkverify \
            -ldflags "-X main.longfellowRev=$(tr -d '[:space:]' < ../zkverify-ffi/longfellow-rev.txt)" .

      - name: assert the built longfellow matches the pinned revision
        # Belt to the bootstrap step (B-M2): bootstrap-longfellow.sh checks out
        # the pinned rev, but if the script is ever bypassed the binary would
        # silently embed a different revision than the one the verifier links
        # and reports. Make the drift loud at build time.
        working-directory: eudi-wallet-poc/verifier/zkverify-ffi
        run: |
          built="$(git -C ../../../longfellow-zk rev-parse HEAD)"
          pinned="$(tr -d '[:space:]' < longfellow-rev.txt)"
          echo "built=$built pinned=$pinned"
          [ "$built" = "$pinned" ] || {
            echo "::error::longfellow-zk HEAD $built != pinned $pinned (verifier/zkverify-ffi/longfellow-rev.txt)"
            exit 1
          }

      - name: go test (the packages that link the Rust staticlib)
        working-directory: eudi-wallet-poc/verifier/go
        # The counterpart of the fast job's `go test ./oid4vp/... ./internal/...
        # ./circuits/...`: between them the two jobs cover the module once.
        # Keeping this narrow also keeps a regression legible — an oid4vp
        # failure reported here would mask the e2e assertion below that is the
        # more informative signal.
        run: go test -race . ./zk/...

      - name: AV report regressions with executed local audit
        run: |
          test -f verifier/zkverify-ffi/target/release/libzkverify.a
          python3 -m unittest discover -s tests -p 'test_av_conformance.py'

      - name: carrier runner (E2E assertions + committed carrier vectors)
        env:
          EE_PROVER: ${{ github.workspace }}/longfellow-zk/rust/target/release/examples/ee_poa_demo
        run: |
          pip install -r tests/requirements-ci.txt
          python3 tests/run_carrier_conformance.py --json carrier-conformance-report.json

  ci-ok:
    name: ci-ok
    # The one check to require in branch protection. `if: always()` makes it run when a needed
    # job failed or was skipped; skipped (no matching paths) counts as success, failure or
    # cancelled does not.
    if: always()
    needs: [changes, fast, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every needed job succeeded or was skipped
        working-directory: ${{ github.workspace }}
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a needed job ended $r"; exit 1 ;; esac
          done
